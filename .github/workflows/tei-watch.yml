# The Guidelines move, and the press must know it.
#
# data/p5-classes.json is derived from a released p5subset, and its version is
# written inside the file. Once a day this workflow asks the TEI Consortium
# what the current release is and compares. If they differ it opens an issue:
# it never regenerates anything by itself, because a new edition of the
# Guidelines is a fact the maintainer reads, not a patch a robot applies.
#
# The body of that issue is written by .github/tei-watch-body.js rather than
# by a heredoc here: prose with backticks and shell expansions inside a YAML
# block is how this file stopped being readable.

name: TEI release watch

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ask what we build from, and what the Consortium publishes
        id: v
        run: node tools/tei-version.js >> "$GITHUB_OUTPUT"

      - name: Write the issue body
        if: steps.v.outputs.remote != '' && steps.v.outputs.remote != steps.v.outputs.local
        env:
          LOCAL: ${{ steps.v.outputs.local }}
          REMOTE: ${{ steps.v.outputs.remote }}
        run: node .github/tei-watch-body.js > issue-body.md

      - name: Open an issue when the two differ
        if: steps.v.outputs.remote != '' && steps.v.outputs.remote != steps.v.outputs.local
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL: ${{ steps.v.outputs.local }}
          REMOTE: ${{ steps.v.outputs.remote }}
        run: |
          title="TEI P5 $REMOTE is out (this repository is built from $LOCAL)"
          if gh issue list --state all --limit 100 --json title --jq '.[].title' | grep -Fqx "$title"; then
            echo "already reported"
            exit 0
          fi
          gh label create tei --description "the Guidelines moved" --color 0E8A16 || true
          gh issue create --title "$title" --label tei --body-file issue-body.md
