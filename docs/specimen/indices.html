<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Specimen</title>
<style>:root{--ground:#FFFFFF;--paper:#FFFFFF;--ink:#1B1B1B;--soft:#6A6A66;--hair:#E5E2D9;--faint:#CFCCC2;--accent:#B01E28;--accent-soft:#9a5a52;--link:#B01E28;--reading:"EB Garamond",Iowan Old Style,Palatino,"Palatino Linotype",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--serif:var(--reading);--measure:44rem}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--serif);
  font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;font-feature-settings:"kern","liga","onum","pnum"}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.torchio{max-width:var(--measure);margin:0 auto;padding:26px 20px 14px;
  border-bottom:1px solid var(--hair)}
header.torchio h1{margin:0;font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:.01em}
header.torchio .sub{margin:6px 0 0;color:var(--soft);font-family:var(--mono);
  font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}

main.torchio{max-width:var(--measure);margin:0 auto;padding:10px 20px 0}

.t-teiHeader{display:none}
body.show-header .t-teiHeader{display:block;border:1px solid var(--hair);
  border-radius:2px;padding:14px 16px;font-size:.85em;color:var(--soft)}

.t-head{font-weight:600;margin:1.3em 0 .4em}
.t-p,.t-ab{margin:.65em 0}
.t-lg{margin:.8em 0 .8em 1.6em}
.t-l{display:block;position:relative}
.t-lg{padding-left:3em}
.t-l.ln5::before{content:attr(data-n);position:absolute;left:-3em;top:.35em;
  font-family:var(--mono);font-size:10px;color:var(--soft);user-select:none}
.t-sp{margin:.65em 0}
.t-speaker{font-family:var(--mono);font-size:.72em;letter-spacing:.1em;
  text-transform:uppercase;color:var(--soft);display:inline-block;margin-right:.5em}
.t-stage{font-style:italic;color:var(--soft)}
.t-opener,.t-closer{color:var(--soft);margin:.65em 0}
.t-salute,.t-dateline,.t-signed{font-style:italic}

.t-persName,.t-placeName,.t-orgName{border-bottom:1px dotted var(--accent-soft)}
.t-foreign,.t-hi,.t-emph,.t-title{font-style:italic}
.t-quote{margin:.8em 0 .8em 1.4em;color:var(--soft)}

/* the class carries the behaviour: anything the ODD declares a member of
   model.pPart.transcriptional is struck through like del, named or not */
.s-3-editoriale>[data-el="del"],.s-3-editoriale.t-del,.t-del{text-decoration:line-through;color:var(--soft)}
.t-metamark{color:var(--soft);font-size:.78em;cursor:help;border-bottom:1px dotted var(--hair)}
.t-add{vertical-align:super;font-size:.82em}
.t-unclear{background:#F5F4EF}
.t-sign{color:var(--soft)}
.t-gap{color:var(--soft);font-family:var(--mono);font-size:.85em}
.t-abbr{border-bottom:1px dotted var(--faint)}

.t-pb{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;
  color:var(--accent);vertical-align:super;margin:0 .18em;user-select:none}

.t-note{font-size:.85em;color:var(--soft);border-left:2px solid var(--hair);
  padding-left:.7em;margin:.5em 0}
.t-note-mark{color:var(--faint);font-size:.55em;vertical-align:super;user-select:none}
/* an apparatus entry in running prose is part of the sentence: it holds a
   note, so the HTML element must be a div (a span may not contain one), but
   it reads inline. Its note is either placed in a margin (absolute) or
   collapsed to its mark, so it never breaks the line either */
.t-app{display:inline}
.t-teiHeader .t-note-mark,.header-full .t-note-mark,.t-app .t-note-mark{display:none}
.t-app .t-note{display:none}
@media(min-width:1180px){.t-app .t-note{display:block}}
.t-note-mark:hover + .t-note,.t-note:hover{border-left-color:var(--accent);color:var(--ink)}
.note-hi{background:rgba(176,30,40,.13);border-radius:2px;transition:background .15s}
.t-note.note-hi{color:var(--ink)}
body.notes-off .t-note{display:none}
body.notes-off .t-note-mark{opacity:.25}
@media(min-width:1180px){
  .t-note{float:right;clear:right;width:14rem;margin:.1em -16.5rem .6em 1em;
    font-size:.78em;line-height:1.4;border-left:0;padding-left:0}
  .header-full .t-note,.t-teiHeader .t-note{float:none;width:auto;margin:.5em 0;
    border-left:2px solid var(--hair);padding-left:.7em}
  .t-note.placed{font-size:.78em;line-height:1.4}
}

.t-app.app-has-lem .t-rdg{display:none}
/* an app without a lem privileges nothing: the first reading stands in the
   text (the others are in the apparatus), never all of them concatenated */
.t-app.app-no-lem>[data-el="rdg"]~[data-el="rdg"],
.t-app.app-no-lem>[data-el="rdgGrp"]~[data-el="rdgGrp"]{display:none}
/* an app that points to the text (double-end-point, location-referenced)
   carries no text of its own: the passage is already in the base text */
.t-app.app-pointing{display:none}
.t-lem{border-bottom:1px dotted var(--accent-soft)}
.t-app[data-type="lac"] [data-el="lem"]{font-family:var(--mono);font-size:.62em;
  font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);
  border-bottom:none;margin-right:.5em;vertical-align:.08em}
.t-app:hover .t-lem,.t-lem:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}

footer.torchio{max-width:var(--measure);margin:44px auto 0;padding:16px 20px 36px;
  border-top:1px solid var(--hair);color:var(--soft);
  font-family:var(--mono);font-size:11px;letter-spacing:.05em}
footer.torchio .press{color:var(--accent)}
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#fff;
  padding:8px 14px;font-family:var(--mono);font-size:11px;z-index:100}
.skip:focus{left:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


.torchio-bar{position:sticky;top:0;z-index:40;background:var(--ground);
  border-bottom:1px solid var(--hair);font-family:var(--mono)}
.torchio-bar .inner{max-width:var(--measure);margin:0 auto;padding:8px 20px;
  display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.torchio-bar .modes{display:inline-flex;border:1px solid var(--hair);
  border-radius:2px;overflow:hidden}
.torchio-bar button{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--soft);background:none;border:none;
  cursor:pointer;padding:6px 14px}
.torchio-bar .modes button.active{background:var(--accent);color:#fff}
.torchio-bar .sw.off{text-decoration:line-through;opacity:.6}

.t-lem{cursor:pointer}
.t-choice{cursor:pointer}
body.app-off .t-lem{border-bottom:none;cursor:inherit}
[data-ref],[data-key]{cursor:pointer}

.torchio-pop{position:absolute;z-index:60;max-width:22rem;background:var(--paper);
  border:1px solid var(--hair);border-radius:2px;padding:12px 14px;
  box-shadow:0 12px 28px -18px rgba(27,27,27,.45);font-size:15px;line-height:1.45}
.torchio-pop .k{font-family:var(--mono);font-size:9.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--soft);display:block;
  margin-bottom:6px}
.torchio-pop .rdgline{display:flex;gap:10px;align-items:baseline;padding:3px 0}
.torchio-pop .sig{font-family:var(--mono);font-size:11px;font-weight:600;
  color:var(--accent);min-width:2.2em}
.torchio-pop .is-lem{border-bottom:1px solid var(--hair)}
.torchio-pop .meta{font-family:var(--mono);font-size:10.5px;color:var(--soft);margin-top:8px}
.torchio-pop .notebody{font-size:14px;line-height:1.5}

/* a verse followed by its apparatus band opens the scheme on click */
body.has-band [data-el="l"]{cursor:pointer}
body.has-align [data-el="l"]{cursor:pointer}
[data-change],[data-hand]{cursor:pointer}
.t-add[data-change],.t-add[data-hand]{border-bottom:1px dotted var(--accent-soft)}
.wv{border-bottom:1px dotted var(--accent-soft);cursor:pointer}
.app-anchored{border-bottom:1px dotted var(--accent-soft);cursor:pointer}
body.app-off .app-anchored{border-bottom:none;cursor:inherit}
body.app-off .wv{border-bottom:none;cursor:inherit}
body.app-off.has-band [data-el="l"]{cursor:inherit}
.torchio-pop .popband{font-size:14px;max-height:18rem;overflow-y:auto}
.torchio-pop .popband .band-e{display:block;margin:.35em 0}
.torchio-pop .popband .band-lem{font-style:italic}
.torchio-pop .popband .bw{color:var(--accent);cursor:pointer}
.torchio-pop .popband .bw:hover{text-decoration:underline}

/* dense notes: those the margins cannot hold collapse to their marks and open
   on click; the ones placed in a margin (.placed) stay visible */
body.notes-dense main.torchio .t-note:not(.placed){display:none!important}
body.notes-dense .t-note-mark{color:var(--accent);cursor:pointer;font-size:.85em;font-weight:700;line-height:0;padding:.3em .3em;margin:-.3em -.1em}
[data-notepop]{cursor:pointer}
body.notes-dense.notes-off .t-note-mark{cursor:default}

/* transcription levels: reading is the default */
.t-choice .t-orig,.t-choice .t-abbr,.t-choice .t-sic{display:none}
body.mode-dipl .t-choice .t-orig,body.mode-dipl .t-choice .t-abbr,body.mode-dipl .t-choice .t-sic{display:inline}
body.mode-dipl .t-choice .t-reg,body.mode-dipl .t-choice .t-expan,body.mode-dipl .t-choice .t-corr{display:none}
/* behaviour by class, not by tag: an element that declares itself a member
   of a TEI model class behaves like the class, whatever it is called */
body.mode-read .s-3-editoriale [data-el="del"],body.mode-read .t-del{display:none}
body.mode-dipl .s-3-editoriale .t-orig,body.mode-dipl .s-3-editoriale .t-abbr{display:inline}
body.mode-read .t-del{display:none}
body.mode-read .t-am{display:none}
body.mode-dipl .t-ex{display:none}
body.mode-read .t-lb br{display:none}
body.mode-read .t-lb::after{content:" "}
body.mode-read .t-lb[data-break="no"]::after{content:none}
body.mode-read .t-add{vertical-align:baseline;font-size:inherit}

.torchio-nav{display:flex;gap:22px;margin-left:auto}
.torchio-nav a{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
  color:var(--soft);text-transform:uppercase}
.torchio-nav a.on{color:var(--accent)}
.torchio-nav a.up{color:var(--accent-soft)}
.torchio-subnav{display:flex;gap:20px;flex-wrap:wrap;max-width:var(--measure);margin:0 auto 1.2em;padding:10px 20px 12px;border-bottom:1px solid var(--hair)}
.torchio-subnav a{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--soft);text-transform:uppercase}
.torchio-subnav a.on{color:var(--accent)}
.torchio-subnav a:hover{color:var(--ink);text-decoration:none}
.torchio-nav a:hover{color:var(--ink);text-decoration:none}
header.torchio{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:baseline}
header.torchio .tt{min-width:14rem}
.about dt{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--soft);margin-top:1.2em}
.about dd{margin:0.3em 0 0}
.about dd.scrollbox{max-height:18rem;overflow-y:auto;border:1px solid var(--hair);
  border-radius:2px;padding:0 12px;margin-top:.5em}
.wit-table,.idx-table{width:100%;border-collapse:collapse;margin:.6em 0}
.wit-table th{text-align:left;font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--soft);
  padding:6px 10px 6px 0;border-bottom:1px solid var(--hair)}
.md-table td:first-child{font-size:1.05em;white-space:nowrap}
.wit-table td,.idx-table td{padding:6px 10px 6px 0;border-bottom:1px solid var(--hair);
  vertical-align:baseline}
.agree-bar{display:inline-block;height:7px;background:var(--accent-soft);border-radius:2px;min-width:2px}
.sigla{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);
  white-space:nowrap}
.occ{font-family:var(--mono);font-size:10.5px;color:var(--soft)}
.occ a{color:var(--accent);margin-right:.5em}
h2.sec{font-size:20px;font-weight:600;margin:1.6em 0 .4em}
.md-code{background:var(--wash,#f6f5f2);border:1px solid var(--hair);border-radius:3px;
  padding:.7em 1em;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.md-code code{background:none;padding:0}
main img{max-width:100%;height:auto}
main hr{border:0;border-top:1px solid var(--hair);margin:1.8em 0}
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#fff;
  padding:8px 14px;font-family:var(--mono);font-size:11px;z-index:100}
.skip:focus{left:0}
.header-full .t-teiHeader{display:block;border:0;padding:0;color:var(--ink);font-size:1em}
.header-full div[data-el]::before{content:attr(data-el);display:block;
  font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--soft);margin:.9em 0 .1em}
.header-full{border:1px solid var(--hair);border-radius:2px;padding:6px 16px 14px;
  font-size:.92em;overflow-x:auto}
.header-full span[data-el]+span[data-el],.t-teiHeader span[data-el]+span[data-el]{margin-left:.3em}
.header-full div[data-el="teiHeader"]::before{content:"TEI Header"}
.header-full div[data-el="fileDesc"]::before{content:"File Description"}
.header-full div[data-el="titleStmt"]::before{content:"Title"}
.header-full div[data-el="editionStmt"]::before{content:"Edition"}
.header-full div[data-el="extent"]::before{content:"Extent"}
.header-full div[data-el="publicationStmt"]::before{content:"Publication"}
.header-full div[data-el="seriesStmt"]::before{content:"Series"}
.header-full div[data-el="notesStmt"]::before{content:"Notes"}
.header-full div[data-el="sourceDesc"]::before{content:"Source"}
.header-full div[data-el="respStmt"]::before{content:"Responsibility"}
.header-full div[data-el="availability"]::before{content:"Availability"}
.header-full div[data-el="licence"]::before{content:"Licence"}
.header-full div[data-el="listWit"]::before{content:"Witnesses"}
.header-full div[data-el="witness"]::before{content:"Witness"}
.header-full div[data-el="msDesc"]::before{content:"Manuscript"}
.header-full div[data-el="msIdentifier"]::before{content:"Identifier"}
.header-full div[data-el="msContents"]::before{content:"Contents"}
.header-full div[data-el="physDesc"]::before{content:"Physical Description"}
.header-full div[data-el="history"]::before{content:"History"}
.header-full div[data-el="encodingDesc"]::before{content:"Encoding"}
.header-full div[data-el="projectDesc"]::before{content:"Project"}
.header-full div[data-el="editorialDecl"]::before{content:"Editorial Practice"}
.header-full div[data-el="samplingDecl"]::before{content:"Sampling"}
.header-full div[data-el="refsDecl"]::before{content:"Reference System"}
.header-full div[data-el="classDecl"]::before{content:"Classification Scheme"}
.header-full div[data-el="listPrefixDef"]::before{content:"Prefixes"}
.header-full div[data-el="profileDesc"]::before{content:"Profile"}
.header-full div[data-el="creation"]::before{content:"Creation"}
.header-full div[data-el="langUsage"]::before{content:"Languages"}
.header-full div[data-el="textClass"]::before{content:"Classification"}
.header-full div[data-el="correspDesc"]::before{content:"Correspondence"}
.header-full div[data-el="handNotes"]::before{content:"Hands"}
.header-full div[data-el="revisionDesc"]::before{content:"Revision History"}
.header-full div[data-el="listChange"]::before{content:"Changes"}
.header-full div[data-el="biblFull"]::before{content:"Bibliographic Record"}
.header-full div[data-el="appInfo"]::before{content:"Application"}
.header-full div[data-el="p"]::before{content:none}
.header-full div[data-el="ab"]::before{content:none}
.header-full div[data-el="list"]::before{content:none}
.header-full div[data-el="item"]::before{content:none}
.header-full div[data-el="table"]::before{content:none}
.header-full div[data-el="row"]::before{content:none}
.header-full div[data-el="cell"]::before{content:none}
.header-full div[data-el="lg"]::before{content:none}
.header-full div[data-el="l"]::before{content:none}
.header-full div[data-el="head"]::before{content:none}
.header-full div[data-el="note"]::before{content:none}
.header-full div[data-el="bibl"]::before{content:none}
.header-full div[data-el="address"]::before{content:none}
.header-full div[data-el="addrLine"]::before{content:none}
.header-full div[data-el="change"]::before{content:none}

.reg-filter{font-family:var(--mono);font-size:12px;padding:6px 10px;
  border:1px solid var(--hair);border-radius:2px;background:var(--paper);
  color:var(--ink);margin:.4em 0;width:14rem;max-width:100%}
.reg-table th{font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--soft);text-align:left;
  padding:6px 10px 6px 0;border-bottom:2px solid var(--hair);cursor:pointer}
.reg-table th[aria-sort="ascending"]::after{content:" \2191"}
.reg-table th[aria-sort="descending"]::after{content:" \2193"}
.reg-count{font-family:var(--mono);font-size:10.5px;color:var(--soft);margin-left:.8em}
.vmap{margin:1.4em 0;padding-top:.4em;border-top:1px solid var(--hair)}
.vmap-n{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;
  color:var(--accent);margin:0 0 .3em}
.vmap-app{margin:.5em 0 .8em}
.vmap-lem{font-style:italic}
.vmap-rdg{font-size:.88em;margin:.15em 0 .15em 1.4em;color:var(--ink)}
.vmap-wit{color:var(--soft)}
.vmap .bw{color:var(--accent);cursor:pointer}
.vmap .bw:hover{text-decoration:underline}
.vmap-count{font-family:var(--mono);font-size:10px;color:var(--soft)}
.vmap-lac .vmap-rdg{color:var(--soft)}
.vmap-edited{color:var(--ink)}
.vmap-mark{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent)}
/* the band is data: the popups read it, the page does not show it */
.app-band{display:none}
.app-band .band-lem{font-style:italic;color:var(--ink)}
.app-band .bw{color:var(--accent);cursor:pointer}
.app-band .bw:hover{text-decoration:underline}
.app-band .band-sep{color:var(--faint)}
:target{background:rgba(176,30,40,.10);border-radius:2px}
.prevnext{display:flex;justify-content:space-between;gap:1em;margin:1.2em 0;
  font-family:var(--mono);font-size:11px}
ol.toc{columns:2;column-gap:2.5em;padding-left:1.4em;margin:1em 0}
.idx-search{font-family:var(--mono);font-size:13px;padding:7px 11px;border:1px solid var(--hair);
  border-radius:2px;background:var(--paper);color:var(--ink);min-width:16rem;margin:.6em 0 .2em}
.alpha{font-family:var(--mono);font-size:11px;letter-spacing:.12em;margin:.3em 0 .6em}
.alpha a{color:var(--accent);text-decoration:none;padding:0 .18em}
.alpha a:hover{text-decoration:underline}
.idx-up{font-size:.7em;color:var(--soft);text-decoration:none;margin-left:.5em}
.idx-up:hover{color:var(--accent)}
.totop{position:fixed;right:22px;bottom:22px;width:34px;height:34px;line-height:32px;text-align:center;
  border:1px solid var(--hair);border-radius:2px;background:var(--paper);color:var(--accent);
  text-decoration:none;font-size:16px}
.totop:hover{border-color:var(--accent)}
.t-line{display:block}
.t-zone{display:block;margin:0 0 .2em}
.t-surface{display:block;margin:1.6em 0;padding:1.2em 1.4em;border:1px solid var(--hair);border-radius:2px}
.t-surface .t-surface{border:none;margin:0;padding:0}
.lx-bar-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:1em 0;
  padding-bottom:.8em;border-bottom:1px solid var(--hair)}
.lx-search{font-family:var(--mono);font-size:13px;padding:7px 11px;border:1px solid var(--hair);
  border-radius:2px;background:var(--paper);color:var(--ink);min-width:14rem}
.lx-ctl{font-family:var(--mono);font-size:11px;color:var(--soft);display:inline-flex;gap:.4em;align-items:center}
.lx-ctl select{font-family:var(--mono);font-size:12px;padding:4px 6px;border:1px solid var(--hair);
  border-radius:2px;background:var(--paper);color:var(--ink)}
.lx-views{margin-left:auto;display:inline-flex;border:1px solid var(--hair);border-radius:2px;overflow:hidden}
.lx-views button{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--soft);background:none;border:none;cursor:pointer;padding:7px 13px}
.lx-views button.active{background:var(--accent);color:#fff}
.lx-table{width:100%;border-collapse:collapse}
.lx-table th{text-align:left;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--soft);padding:6px 10px 6px 0;border-bottom:1px solid var(--hair)}
.lx-table td{padding:4px 10px 4px 0;border-bottom:1px solid var(--faint)}
