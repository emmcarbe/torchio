<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 20" width="188" height="20"
     role="img" aria-label="DOI 10.5281/zenodo.21740661">
  <!--
    The DOI badge lives in this repository rather than being fetched from
    Zenodo. Zenodo's badge endpoint rate-limits GitHub's image proxy, which
    then serves a 502, and the badge on the front page breaks: the citation
    of a permanent identifier was the one thing on the page that depended on
    a service answering in that instant.

    The identifier drawn here is the concept DOI, which stands for every
    version and never changes, so a static file is not a shortcut: it is the
    accurate form. The version DOI belongs in CITATION.cff and in the
    citation block of the README, where it changes with each release.
  -->
  <title>DOI 10.5281/zenodo.21740661</title>
  <rect width="188" height="20" rx="3" fill="#6A6A66"/>
  <path d="M3 0 h33 v20 H3 a3 3 0 0 1 -3 -3 V3 a3 3 0 0 1 3 -3 z" fill="#1B1B1B"/>
  <rect x="0.5" y="0.5" width="187" height="19" rx="3" fill="none"
        stroke="#6A6A66" stroke-width="1"/>
  <g fill="#FFFFFF" text-anchor="middle"
     font-family="EB Garamond, Iowan Old Style, Palatino, Georgia, serif"
     font-size="11">
    <text x="18" y="14.2" letter-spacing="0.7">DOI</text>
    <text x="112" y="14.2" textLength="136" lengthAdjust="spacingAndGlyphs">10.5281/zenodo.21740661</text>
  </g>
</svg>
