<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 20" width="176" height="20"
     role="img" aria-label="Archived in Software Heritage">
  <!--
    Drawn here rather than fetched from archive.softwareheritage.org, whose
    badge endpoint returns an anti-bot page to an automated request instead
